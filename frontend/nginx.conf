server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;  # uma avaliação completa pode levar alguns minutos
    }

    location / {
        try_files $uri /index.html;
    }
}
